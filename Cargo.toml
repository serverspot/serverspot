[package]
name = "serverspot"
version = "0.1.0"
authors = ["HyperCodec"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
dotenvy = { version = "0.15.7", features = ["clap"], optional = true }
surrealdb = { version = "3.2.3", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:surrealdb", "dep:dotenvy"]