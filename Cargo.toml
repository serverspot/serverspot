[package]
name = "serverspot"
version = "0.1.0"
authors = ["HyperCodec"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
async-once-cell = { version = "0.5.4", optional = true }
async-trait = "0.1.92"
axum_session = { version = "0.20.1", optional = true }
axum_session_auth = { version = "0.20.0", optional = true }
axum_session_surreal = { version = "0.8.0", optional = true }
base64 = "0.23.1"
bcrypt = { version = "0.19.3", optional = true }
bitflags = "2.13.1"
chrono = "0.4.45"
dashmap = "6.2.1"
dioxus = { version = "0.7.10", features = ["router", "fullstack"] }
dotenvy = { version = "0.15.7", features = ["clap"], optional = true }
hmac = { version = "0.13.0", optional = true }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
surrealdb = { version = "3.2.3", optional = true }
thiserror = "2.0.20"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Build with `--no-default-features --features server` so `web` is not also enabled.
# Enabling both breaks SSR hydration (dioxus#5427).
server = [
    "dioxus/server",
    "dep:surrealdb",
    "dep:dotenvy",
    "dep:axum_session_auth",
    "dep:axum_session_surreal",
    "dep:axum_session",
    "dep:async-once-cell",
    "dep:bcrypt",
    "dep:hmac",
]

[package.metadata.docs.rs]
features = ["web"]
