services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=serverspot_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - proxy
    depends_on:
      serverspot:
        condition: service_healthy

  serverspot:
    labels:
      - traefik.enable=true
      - traefik.docker.network=serverspot_proxy
      - traefik.http.routers.serverspot.rule=Host(`${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.serverspot.entrypoints=websecure
      - traefik.http.routers.serverspot.tls.certresolver=le
      - traefik.http.services.serverspot.loadbalancer.server.port=8080
    networks:
      - internal
      - proxy

volumes:
  letsencrypt:

networks:
  proxy:
