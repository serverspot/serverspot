name: CI-CD

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - run: cargo check --features web,server
  
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - run: cargo test --features web,server
  
