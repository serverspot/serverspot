name: serverspot

services:
  serverspot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SURREAL_URL: "surrealdb:8000"
      SURREAL_USER: "${SURREAL_USER:-root}"
      SURREAL_PASS: "${SURREAL_PASS:?set SURREAL_PASS in .env}"
      SURREAL_NS: "${SURREAL_NS:-serverspot}"
      IP: "0.0.0.0"
      PORT: "8080"
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      surrealdb:
        condition: service_healthy
      surrealkit:
        condition: service_completed_successfully
    ports:
      - "${SERVERSPOT_BIND:-0.0.0.0}:${EXPOSE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 40s

  surrealkit:
    image: ghcr.io/surrealdb/surrealkit:latest
    depends_on:
      surrealdb:
        condition: service_healthy
    command: sync
    environment:
      SURREALDB_HOST: "ws://surrealdb:8000"
      SURREALDB_NAME: "serverspot"
      SURREALDB_NAMESPACE: "${SURREAL_NS:-serverspot}"
      SURREALDB_USER: "${SURREAL_USER:-root}"
      SURREALDB_PASSWORD: "${SURREAL_PASS:?set SURREAL_PASS in .env}"
      SURREALDB_FOLDER: "/database"
    networks:
      - internal
    volumes:
      - ./database:/database:ro
    restart: "no"

  surrealdb:
    image: surrealdb/surrealdb:v3.2.3
    command:
      - start
      - --user
      - ${SURREAL_USER:-root}
      - --pass
      - ${SURREAL_PASS:?set SURREAL_PASS in .env}
      - rocksdb:/data/db.db
    volumes:
      - surreal_data:/data
    user: root
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "ws://127.0.0.1:8000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal
    restart: unless-stopped

volumes:
  surreal_data:

networks:
  internal:
